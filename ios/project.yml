# Project Xcode của bản iPad, dựng bằng XcodeGen (`xcodegen generate` trong thư mục ios/ — chạy trên GitHub Actions).
# Cấu hình: Debug (dev), Beta (bản thử: tối ưu như Release + cổng gỡ lỗi trong mạng LAN, mã gói .debug), Release.
name: ConBangTV
options:
  bundleIdPrefix: vn.chimto
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Beta: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
targets:
  ConBangTV:
    type: application
    platform: iOS
    sources:
      - path: ConBangTV
        excludes:
          - "Info.plist"
      # Trình phát dùng chung với bản Android (player-agent.js, player.html, hls.html, hls.js, page-focus.js)
      - path: ../app/src/main/assets
        group: SharedAssets
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: ConBangTV/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Bản thử mở cổng gỡ lỗi trong mạng nhà để máy tính điều khiển và chụp màn hình app.
        LSApplicationQueriesSchemes:
          - apple-magnifier
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_NAME: ConBangTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug
          APP_DISPLAY_NAME: "Côn Bằng (thử)"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEVTOOLS
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug
          APP_DISPLAY_NAME: "Côn Bằng (thử)"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEVTOOLS
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv
          APP_DISPLAY_NAME: "Côn Bằng TV"

  # Test phần lõi (đọc trang, chấm điểm server…) chạy thẳng trên macOS, không cần máy ảo iPad
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConBangTV/Sources/Core
      - path: CoreTests
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.coretests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  ConBangTV:
    build:
      targets:
        ConBangTV: all
    run:
      config: Debug
    archive:
      config: Release
  CoreTests:
    build:
      targets:
        CoreTests: [test]
    test:
      config: Debug
      targets:
        - CoreTests
