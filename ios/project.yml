# Project Xcode của bản iPad, dựng bằng XcodeGen (`xcodegen generate` trong thư mục ios/ — chạy trên GitHub Actions).
# Cấu hình: Debug (dev), Beta (bản thử: tối ưu như Release + cổng gỡ lỗi trong mạng LAN, mã gói .debug), Release.
name: ConBangTV
options:
  bundleIdPrefix: vn.chimto
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true
  # Định dạng project của Xcode 15.3 (objectVersion 63): Mac trong nhà chỉ có Xcode 15.4 (macOS 14.4); xcodegen 2.45 mặc định
  # sinh định dạng Xcode 16 (77) mà Xcode 15 không mở được. Xcode 16 của GitHub vẫn mở định dạng cũ.
  projectFormat: xcode15_3
  # Ngôn ngữ chính tiếng Việt: menu hệ thống của bản Mac (Tệp, Sửa, Cửa sổ…) và menu chép / dán của iOS hiện tiếng Việt
  developmentLanguage: vi
configs:
  Debug: debug
  Beta: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.18"
    CURRENT_PROJECT_VERSION: "24"
    DEVELOPMENT_TEAM: ""
  # Nhóm App Group (app ghi dữ liệu cho widget) và lược đồ URL mở app — bản thử khác bản chính để cài song song
  configs:
    Debug:
      APP_GROUP: group.vn.chimto.tv.debug
      URL_SCHEME: conbangtv-thu
    Beta:
      APP_GROUP: group.vn.chimto.tv.debug
      URL_SCHEME: conbangtv-thu
    Release:
      APP_GROUP: group.vn.chimto.tv
      URL_SCHEME: conbangtv
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
targets:
  ConBangTV:
    type: application
    platform: iOS
    sources:
      - path: ConBangTV
        excludes:
          - "Info.plist"
      # Dữ liệu widget dùng chung app ↔ widget
      - path: Shared
      # Trình phát dùng chung với bản Android (player-agent.js, player.html, hls.html, hls.js, page-focus.js)
      - path: ../app/src/main/assets
        group: SharedAssets
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      # Widget chỉ cho iPad / iPhone — bản Mac (Mac Catalyst) không kèm
      - target: ConBangWidget
        platformFilter: iOS
    info:
      path: ConBangTV/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Bản Mac lấy CFBundleName làm tên trên thanh menu / Dock («ConBangTV» → «Côn Bằng TV»); iPad dùng CFBundleDisplayName
        CFBundleName: $(APP_DISPLAY_NAME)
        # Mã hồ sơ NextDNS của app (DNS mã hoá, Core/Doh.swift): secret NEXTDNS_ID của repo, CI truyền vào lúc dựng — không ghi
        # trong code; trống thì chuỗi DNS mã hoá bỏ NextDNS
        CBNextDnsId: $(NEXTDNS_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        # iPhone: màn chính dọc / ngang; trình phát tự xoay ngang (PlayerController)
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Đồng bộ trong nhà — tìm TV / iPad / iPhone có Côn Bằng TV trong mạng Wi‑Fi để đồng bộ lịch sử xem.
        NSBonjourServices:
          - _conbangtv._tcp
        LSApplicationQueriesSchemes:
          - apple-magnifier
        # Widget «Xem tiếp» mở app bằng conbangtv://play?… (bản thử: conbangtv-thu://)
        CFBundleURLTypes:
          - CFBundleURLName: vn.chimto.tv.widget
            CFBundleURLSchemes:
              - $(URL_SCHEME)
        ConBangAppGroup: $(APP_GROUP)
        ConBangURLScheme: $(URL_SCHEME)
        ITSAppUsesNonExemptEncryption: false
        # Bản Mac: mục trong Launchpad / Finder (iPad bỏ qua)
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi]
    settings:
      base:
        # Một IPA cho cả iPhone (1) và iPad (2)
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: ConBangTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bản Mac = chính app iPad dựng bằng Mac Catalyst (giao diện iPad, macOS 12+ — ứng với iOS 15), Intel + Apple Silicon.
        # Mã gói giữ nguyên vn.chimto.tv (bản thử: vn.chimto.tv.debug). Đóng gói: scripts/package-mac.sh
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        # SPI của WebKit cho proxy (Player/WebKitSPI.m)
        SWIFT_OBJC_BRIDGING_HEADER: ConBangTV/Sources/Player/WebKitSPI.h
        CLANG_ENABLE_OBJC_ARC: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug
          APP_DISPLAY_NAME: "Côn Bằng (thử)"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEVTOOLS
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug
          APP_DISPLAY_NAME: "Côn Bằng (thử)"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEVTOOLS
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv
          APP_DISPLAY_NAME: "Côn Bằng TV"

  # Widget «Xem tiếp» (WidgetKit): đọc feed.json + ảnh bìa app ghi trong App Group
  ConBangWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Côn Bằng TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ConBangAppGroup: $(APP_GROUP)
        ConBangURLScheme: $(URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: ConBangWidget
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug.widget
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.debug.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.tv.widget

  # Test phần lõi (đọc trang, chấm điểm server…) chạy thẳng trên macOS, không cần máy ảo iPad
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ConBangTV/Sources/Core
      - path: CoreTests
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: vn.chimto.coretests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  ConBangTV:
    build:
      targets:
        ConBangTV: all
    run:
      config: Debug
    archive:
      config: Release
  CoreTests:
    build:
      targets:
        CoreTests: [test]
    test:
      config: Debug
      targets:
        - CoreTests
