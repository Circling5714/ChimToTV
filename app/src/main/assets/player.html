<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="f" src="{{SRC}}" referrerpolicy="unsafe-url" scrolling="no"
        allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
<script>
  window.__chimtoState = null;
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (m && m.chimto === 'state') window.__chimtoState = m;
  });
  function chimtoCmd(c, a) {
    document.getElementById('f').contentWindow.postMessage({ chimto: 'cmd', cmd: c, arg: a }, '*');
    return true;
  }
</script>
</body>
</html>
