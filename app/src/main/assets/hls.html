<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  video::cue { background: rgba(0, 0, 0, .6); }
</style>
<script>{{AGENT}}</script>
</head>
<body>
<video id="v" playsinline></video>
<script src="/__chimto/hls.js"></script>
<script>
// Phát thẳng luồng HLS (.m3u8) của trang Next.js kiểu PhimMoi (nguồn KKPhim…) bằng hls.js đóng kèm app
// (PlayerActivity trả tệp cho đường dẫn /__chimto/hls.js). player-agent.js ở trên điều khiển <video> như mọi trang.
// Lỗi hẳn (vd server chết, không tải được video) thì đặt window.__chimtoErr để app báo và gợi ý đổi server.
(function () {
  var SRC = {{SRC}}, SUB = {{SUB}}, START = {{START}}, BUFFER = 120;
  var v = document.getElementById('v');
  window.__chimtoBuffer = BUFFER;

  // Phụ đề rời (bản Song Ngữ của server HD không in chữ vào hình): tệp WebVTT ngụy trang ảnh PNG (ảnh 1×1 đứng
  // trước chữ "WEBVTT") → tải về, bỏ phần ảnh, gắn vào <video> dạng track để WebView tự hiện chữ.
  if (SUB) {
    fetch(SUB).then(function (r) { return r.text(); }).then(function (t) {
      var i = t.indexOf('WEBVTT');
      if (i < 0) return;
      var tr = document.createElement('track');
      tr.kind = 'subtitles'; tr.srclang = 'vi'; tr.default = true;
      tr.src = URL.createObjectURL(new Blob([t.slice(i)], { type: 'text/vtt' }));
      v.appendChild(tr);
      tr.track.mode = 'showing';
    }).catch(function () {});
  }

  // KKPhim chèn quảng cáo cờ bạc ~30 s giữa phim: một khối DISCONTINUITY mà mọi đoạn đều có dạng
  // /vN/<32 ký tự hex>/segment_NNNN.ts (đoạn phim tên ngẫu nhiên nằm cạnh index.m3u8) → bỏ cả khối.
  // Khối convertvN/… (~24 s) là phim có dòng chữ quảng cáo đè lên: giữ lại, bỏ là mất đoạn phim.
  var AD = /\/v\d+\/[0-9a-f]{32}\/segment_\d+\.ts/;
  function isUri(l) { return l && l.charAt(0) !== '#'; }
  function strip(text) {
    if (text.indexOf('#EXT-X-DISCONTINUITY') < 0) return text;
    var lines = text.split('\n'), out = [], blocks = [], cur = null, i;
    for (i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf('#EXT-X-DISCONTINUITY') === 0 && l.indexOf('#EXT-X-DISCONTINUITY-SEQUENCE') !== 0) {
        cur = [l];
        blocks.push(cur);
      } else if (cur || l.indexOf('#EXTINF') === 0 || isUri(l)) {
        if (!cur) blocks.push(cur = []);
        cur.push(l);
      } else {
        out.push(l); // phần đầu danh sách (#EXTM3U, #EXT-X-TARGETDURATION…)
      }
    }
    for (i = 0; i < blocks.length; i++) {
      var segs = blocks[i].filter(isUri);
      if (segs.length && segs.every(function (u) { return AD.test(u); })) {
        // Khối quảng cáo nằm cuối thì giữ dấu hết danh sách (mất nó hls.js coi là phát trực tiếp)
        out = out.concat(blocks[i].filter(function (l) { return l.indexOf('#EXT-X-ENDLIST') === 0; }));
        continue;
      }
      out = out.concat(blocks[i]);
    }
    return out.join('\n');
  }

  // Tệp video thường (MP4 của CLB Phim Xưa, không phải .m3u8): phát thẳng bằng <video>
  var FILE = !/\.m3u8$/i.test(SRC.split('?')[0].split('#')[0]);
  if (FILE || !window.Hls || !Hls.isSupported()) {
    // WebView không có MediaSource: thử để Android tự phát HLS (không bỏ được quảng cáo)
    v.src = SRC;
    if (START > 0) v.addEventListener('loadedmetadata', function once() {
      v.removeEventListener('loadedmetadata', once);
      if (v.currentTime < 1) v.currentTime = START;
    });
    v.addEventListener('error', function () { window.__chimtoErr = 'media-error-' + (v.error ? v.error.code : 0); });
    var p0 = v.play(); if (p0 && p0.catch) p0.catch(function () {});
    return;
  }
  var Base = Hls.DefaultConfig.loader;

  // Đoạn video ngụy trang ảnh PNG (VSMOV: ảnh nhỏ đứng trước dữ liệu MPEG-TS) → bỏ phần ảnh, giữ từ byte đồng bộ 0x47
  // đầu tiên mà các gói 188 byte sau cũng bắt đầu bằng 0x47. Đoạn bình thường (bắt đầu bằng 0x47) giữ nguyên.
  function unwrap(buf) {
    var b = new Uint8Array(buf);
    if (b.length < 8 || b[0] !== 0x89 || b[1] !== 0x50 || b[2] !== 0x4E || b[3] !== 0x47) return buf;
    for (var i = 8, n = Math.min(b.length - 188 * 3, 65536); i < n; i++) {
      if (b[i] === 0x47 && b[i + 188] === 0x47 && b[i + 376] === 0x47 && b[i + 564] === 0x47) return buf.slice(i);
    }
    return buf;
  }
  function FragLoader(config) {
    var l = new Base(config), load = l.load.bind(l);
    l.load = function (ctx, cfg, cb) {
      var ok = cb.onSuccess;
      cb.onSuccess = function (resp, stats, c, nd) {
        if (resp.data instanceof ArrayBuffer) resp.data = unwrap(resp.data);
        ok(resp, stats, c, nd);
      };
      load(ctx, cfg, cb);
    };
    return l;
  }
  function AdFreeLoader(config) {
    var l = new Base(config), load = l.load.bind(l);
    l.load = function (ctx, cfg, cb) {
      if (ctx.type === 'manifest' || ctx.type === 'level') {
        var ok = cb.onSuccess;
        cb.onSuccess = function (resp, stats, c, nd) {
          if (typeof resp.data === 'string') resp.data = strip(resp.data);
          ok(resp, stats, c, nd);
        };
      }
      load(ctx, cfg, cb);
    };
    return l;
  }

  // Danh sách phát: thử lại 3 lần (1 → 2 → 4 s) thay vì 1, mạng TV chập chờn lúc mở tập không thành "server lỗi"
  function load(ttfb) {
    return { default: { maxTimeToFirstByteMs: ttfb, maxLoadTimeMs: 20000,
      timeoutRetry: { maxNumRetry: 2, retryDelayMs: 0, maxRetryDelayMs: 0 },
      errorRetry: { maxNumRetry: 3, retryDelayMs: 1000, maxRetryDelayMs: 8000 } } };
  }
  // START > 0: app báo trước chỗ bắt đầu (xem tiếp / hết nhạc mở đầu) → tải thẳng đoạn ở đó
  var hls = new Hls({ pLoader: AdFreeLoader, fLoader: FragLoader, maxBufferLength: BUFFER, maxMaxBufferLength: 600, backBufferLength: 30,
    manifestLoadPolicy: load(Infinity), playlistLoadPolicy: load(10000), startPosition: START > 0 ? START : -1 });

  // Phục hồi khi lỗi hẳn: tối đa vài lần trong 2 phút (phim dài, mạng rớt lẻ tẻ cách xa nhau vẫn phục hồi được)
  var fixes = { media: [], net: [] };
  function canFix(kind, max) {
    var now = Date.now();
    var recent = fixes[kind] = fixes[kind].filter(function (t) { return now - t < 120000; });
    if (recent.length >= max) return false;
    recent.push(now);
    return true;
  }
  hls.on(Hls.Events.ERROR, function (e, d) {
    if (!d.fatal) return;
    if (d.type === Hls.ErrorTypes.MEDIA_ERROR && canFix('media', 2)) { hls.recoverMediaError(); return; }
    // Đang xem mà mạng chập chờn: thử tải tiếp. Chưa phát được giây nào (đã thử lại ở trên) thì báo lỗi (server hỏng).
    if (d.type === Hls.ErrorTypes.NETWORK_ERROR && v.currentTime > 0 && canFix('net', 5)) {
      setTimeout(function () { hls.startLoad(); }, 3000);
      return;
    }
    window.__chimtoErr = d.details || d.type;
  });
  hls.on(Hls.Events.MANIFEST_PARSED, function () { var p = v.play(); if (p && p.catch) p.catch(function () {}); });
  hls.loadSource(SRC);
  hls.attachMedia(v);
})();
</script>
</body>
</html>
