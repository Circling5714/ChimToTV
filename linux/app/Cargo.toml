[package]
name = "conbangtv"
description = "Côn Bằng TV — xem phim bằng bàn phím / remote / chuột"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "conbangtv"
path = "src/main.rs"

[dependencies]
conbang-core = { path = "../core" }
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
pangocairo = "0.18"
# WebKitGTK 4.1 (GTK3). Chỉ dùng hàm có từ 2.32 trở xuống để chạy được cả trên Ubuntu 22.04 / Debian 12 chưa cập nhật.
webkit2gtk = { version = "2.0", features = ["v2_32"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
# Giải mã ảnh bìa (JPEG / PNG / WebP / GIF) bằng Rust — máy Ubuntu không phải máy nào cũng có bộ giải mã WebP cho GdkPixbuf
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha1 = "0.10"
url = "2"
libc = "0.2"
javascriptcore = { package = "javascriptcore-rs", version = "1" }
