# Côn Bằng TV cho Linux (Ubuntu 22.04+ / Linux Mint 21+ / Debian 12+): Rust + GTK3 + WebKitGTK 4.1.
#   core/ — lõi không dính giao diện (đọc trang, trang chủ tổng hợp, cài đặt, mạng: cổng SOCKS nội bộ, DNS mã hoá, vượt chặn,
#           proxy, đồng bộ). Cùng tên hàm với bản Android (app/), iPad (ios/), Windows (windows/) để sửa song song.
#   app/  — giao diện GTK3 + trình phát WebKitGTK (dùng chung trang phát app/src/main/assets của bản Android).
[workspace]
resolver = "2"
members = ["core", "app", "ffi"]
# Dựng mặc định (máy Linux, container bản phát hành): lõi + app GTK. Bản Windows dựng riêng `cargo build -p conbang-ffi`.
default-members = ["core", "app"]

[workspace.package]
# Số hiệu bản Linux (tag linux-v<bản>)
version = "1.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
# dựng nhanh, chạy vẫn đủ mượt để thử
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
