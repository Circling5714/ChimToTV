[package]
name = "conbang-core"
description = "Lõi Côn Bằng TV (không dính giao diện): đọc trang phim, trang chủ tổng hợp, cài đặt, mạng"
version.workspace = true
edition.workspace = true
license.workspace = true

# build.rs: đóng mã hồ sơ NextDNS (keys/nextdns.txt, không có trên git) vào tệp chạy — như bản Windows
build = "build.rs"

[lib]
name = "cbtv"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "cookies", "stream", "http2"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
scraper = "0.20"
regex = "1"
url = "2"
percent-encoding = "2"
encoding_rs = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = "1"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
# DNS mã hoá (doh.rs): TLS tới máy chủ DoH / DoT — cùng rustls (ring) với reqwest, chứng chỉ gốc của máy
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
dirs = "5"
html-escape = "0.2"
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
